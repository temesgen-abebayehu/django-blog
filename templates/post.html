{% load static %}

<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'style.css' %}">
  </head>

  <body>
    <div class="header">
      <h1>Temu's blog</h1>
    </div>
    <div class="row">
      <div class="leftcolumn">
        <div class="card">
            <h2>{{post.title}}</h2>
            <h5>{{post.created_at}}</h5>
            <p>{{post.body}}</p>
        </div>
      </div>
    </div>
  </body>
</html>
