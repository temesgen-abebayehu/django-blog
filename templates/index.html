

{% load static %}

<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="{% static 'style.css' %}">
  </head>

  <body>
    {% include 'header.html' %}
    
    <div class="header">
      <h1>Temu's blog</h1>
    </div>
    <div class="row">
      <div class="leftcolumn">
        {% for post in posts reversed%}
        <div class="card">
          <a href="/post/{{post.id}}">
            <h2>{{post.title}}</h2>
            <h5>{{post.created_at}}</h5>
            <p>{{post.body|truncatewords:20}}</p>
          </a>
        </div>
        {% endfor %}
      </div>
    </div>

    {% include 'footer.html' %}
  </body>
</html>
